name: migrate-database

# Render free services have no shell, so schema migrations run here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          : "${DATABASE_URL:?MIGRATION_DATABASE_URL secret is required}"
          node infra/postgres/run-migrations.mjs
