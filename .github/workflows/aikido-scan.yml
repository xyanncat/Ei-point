# Aikido security scan (SAST + dependencies + IaC + secrets)
#
# Uses the Aikido Local Scanner: code is scanned inside the runner and only
# results upload to Aikido — source never leaves the premises.
# Setup (one time, ~5 min): see docs/security.md. Until AIKIDO_API_KEY exists
# as a repo secret, the job is skipped by its `if:` gate (an empty --apikey
# would swallow the next CLI flag and fail the run — fixed 2026-10-10).
#
# Scan only main: Aikido collects results under one repository name per branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

name: Aikido Scan

jobs:
  aikido-local-scan-repo:
    runs-on: ubuntu-latest
    container:
      image: aikidosecurity/local-scanner:latest
    steps:
      - name: Check for API key
        # Step-level gate (job-level `if:` on secrets is rejected at startup):
        # without a key the scan step skips and the run stays green.
        if: ${{ secrets.AIKIDO_API_KEY == '' }}
        run: echo "AIKIDO_API_KEY not set — see docs/security.md, scan skipped."
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: my-repo
      - name: Run scan
        if: ${{ secrets.AIKIDO_API_KEY != '' }}
        run: >
          aikido-local-scanner scan my-repo
          --apikey ${{ secrets.AIKIDO_API_KEY }}
          --repositoryname Ei-point
          --branchname main
