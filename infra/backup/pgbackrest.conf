# pgBackRest configuration for Ei Point (§9)
# PostgreSQL base backups and continuous WAL archiving to off-host S3-compatible storage.

[global]
repo1-type=s3
repo1-s3-endpoint=${S3_ENDPOINT:-s3.amazonaws.com}
repo1-s3-bucket=${S3_BACKUP_BUCKET:-ei-point-backups}
repo1-s3-region=${S3_REGION:-us-east-1}
repo1-s3-key=${S3_ACCESS_KEY:-}
repo1-s3-key-secret=${S3_SECRET_KEY:-}
repo1-path=/backups/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
repo1-retention-archive=14
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${BACKUP_CIPHER_PASSPHRASE:-}
compress-type=zst
compress-level=3
process-max=2
start-fast=y

[ei-point]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
pg1-port=5432
