# Render Blueprint — himiko (community, welcome/leave, XP)
# One always-on free service per workspace. See docs/operations/render-vercel.md.
services:
  - type: web
    name: ei-point-himiko
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./apps/bots/himiko/Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: BOT_KEY
        value: himiko
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GUILD_ALLOWLIST
        sync: false
      - key: EI_POINT_OWNER_ID
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: BOT_ACTIVE_POLL_SECONDS
        value: "5"
      - key: BOT_IDLE_POLL_SECONDS
        value: "900"
