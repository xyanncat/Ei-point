name: ei-point
services:
  postgres:
    # Local custom pgBackRest image; release manifests must pin its published digest.
    image: "ei-point/postgres:local"
    build: { context: ../.., dockerfile: infra/backup/Dockerfile }
    restart: unless-stopped
    # Archive each completed WAL segment into the durable pgBackRest repository.
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=2GB", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=60s", "-c", "archive_command=pgbackrest --stanza=ei-point archive-push %p"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-ei_point_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackrest:/var/lib/pgbackrest
      - ../backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    networks: [data]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 2048
    cgroup_parent: ei-point.slice
    deploy:
      resources:
        limits: { memory: 6G }
        reservations: { memory: 4G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
    # Note: POSTGRES_USER here is the admin bootstrap login (see .env.example).
    # App services connect via DATABASE_URL with the least-privilege ei_point_app login.

  migrate:
    profiles: ["maintenance"]
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    restart: "no"
    command: ["sh", "-c", "node infra/postgres/run-migrations.mjs && node infra/postgres/bootstrap-role.mjs"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      APPLICATION_DATABASE_URL: ${DATABASE_URL}
    networks: [data]
    depends_on: { postgres: { condition: service_healthy } }
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 256
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 256M } } }

  nginx:
    image: "nginx:1.27.3-alpine"
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - type: bind
        source: ../nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - artwork:/srv/artwork:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    networks:
      edge: {}
      app:
        ipv4_address: ${TRUSTED_PROXY_IP:-172.29.10.250}
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 256
    cgroup_parent: ei-point.slice
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
    read_only: true

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL}
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_IP:-172.29.10.250}/32
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN}
      DASHBOARD_ADMIN_IDS: ${DASHBOARD_ADMIN_IDS:-}
      VAULT_SECRET: ${VAULT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      COMMERCE_GUILD_ID: ${COMMERCE_GUILD_ID:-}
      PAYMENT_ORIGIN: ${PAYMENT_ORIGIN}
      UPI_PAYEE_VPA: ${UPI_PAYEE_VPA:-}
      UPI_PAYEE_NAME: ${UPI_PAYEE_NAME:-Ei point}
      USDT_TRC20_ADDRESS: ${USDT_TRC20_ADDRESS:-}
      INR_PER_USDT: ${INR_PER_USDT:-}
      USDT_REFERENCE_FEE: ${USDT_REFERENCE_FEE:-1}
      RAZORPAY_PAYMENT_PAGE: ${RAZORPAY_PAYMENT_PAGE:-}
      COMMERCE_REFERRAL_REWARD_MINOR: ${COMMERCE_REFERRAL_REWARD_MINOR:-0}
      COMMERCE_STAFF_CHANNEL_ID: ${COMMERCE_STAFF_CHANNEL_ID:-}
      DISCORD_SECURITY_BOT_TOKEN: ${DISCORD_SECURITY_BOT_TOKEN:-}
      DISCORD_MODERATION_BOT_TOKEN: ${DISCORD_MODERATION_BOT_TOKEN:-}
      DISCORD_COMMUNITY_BOT_TOKEN: ${DISCORD_COMMUNITY_BOT_TOKEN:-}
      DISCORD_AI_BOT_TOKEN: ${DISCORD_AI_BOT_TOKEN:-}
      DISCORD_MUSIC_BOT_TOKEN: ${DISCORD_MUSIC_BOT_TOKEN:-}
      DISCORD_COMMERCE_BOT_TOKEN: ${DISCORD_COMMERCE_BOT_TOKEN:-}
      DISCORD_KAFKA_BOT_TOKEN: ${DISCORD_KAFKA_BOT_TOKEN:-}
      DISCORD_CYRENE_BOT_TOKEN: ${DISCORD_CYRENE_BOT_TOKEN:-}
      DISCORD_ROBIN_BOT_TOKEN: ${DISCORD_ROBIN_BOT_TOKEN:-}
      DISCORD_CIPHER_BOT_TOKEN: ${DISCORD_CIPHER_BOT_TOKEN:-}
      DISCORD_SILVERWOLF_BOT_TOKEN: ${DISCORD_SILVERWOLF_BOT_TOKEN:-}
      DISCORD_HIMIKO_BOT_TOKEN: ${DISCORD_HIMIKO_BOT_TOKEN:-}
      BOT_KEY: ${EMBED_WORKER_BOT_KEY:-}
      BOT_TOKEN: ${EMBED_WORKER_BOT_TOKEN:-}
    networks: [app, data]
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 1024
    cgroup_parent: ei-point.slice
    deploy:
      resources:
        limits: { memory: 1G }
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  web:
    build: { context: ../.., dockerfile: apps/dashboard/Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_API_BASE: http://api:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    networks: [app]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 1024
    cgroup_parent: ei-point.slice
    deploy:
      resources:
        limits: { memory: 1G }
    depends_on: [api]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  # --- Bots: 5× Node (discord.js 14) + 1× Python (music). Caps per §7. ---
  bot-security:
    profiles: ["legacy-disabled"]
    build: { context: ../.., dockerfile: apps/bots/security/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_KEY: security
      BOT_TOKEN: ${DISCORD_SECURITY_BOT_TOKEN:-}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
    networks: [app, data]
    ports: ["127.0.0.1:3101:3101"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 2G } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  bot-moderation:
    profiles: ["legacy-disabled"]
    build: { context: ../.., dockerfile: apps/bots/moderation/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_KEY: moderation
      BOT_TOKEN: ${DISCORD_MODERATION_BOT_TOKEN:-}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
    networks: [app, data]
    ports: ["127.0.0.1:3102:3102"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 2G } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  bot-community:
    build: { context: ../.., dockerfile: apps/bots/community/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EI_POINT_OWNER_ID: ${EI_POINT_OWNER_ID:-}
      EI_POINT_EMBED_IMAGE_URL: ${EI_POINT_EMBED_IMAGE_URL:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/docs/assets/ei-point-pulse.gif}
      EI_POINT_EMBED_IMAGE_SILVERWOLF: ${EI_POINT_EMBED_IMAGE_SILVERWOLF:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/project%20assets/bots/Silver%20Wolf/embed.png}
      BOT_KEY: silverwolf
      BOT_TOKEN: ${DISCORD_SILVERWOLF_BOT_TOKEN:-${DISCORD_COMMUNITY_BOT_TOKEN:-}}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
    networks: [app, data]
    ports: ["127.0.0.1:3103:3103"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    volumes: ["artwork:/srv/artwork:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3103/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 2G } } }
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  bot-ai:
    build: { context: ../.., dockerfile: apps/bots/ai/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EI_POINT_OWNER_ID: ${EI_POINT_OWNER_ID:-}
      EI_POINT_EMBED_IMAGE_URL: ${EI_POINT_EMBED_IMAGE_URL:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/docs/assets/ei-point-pulse.gif}
      EI_POINT_EMBED_IMAGE_CYRENE: ${EI_POINT_EMBED_IMAGE_CYRENE:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/project%20assets/bots/Cyrene/embed.png}
      BOT_KEY: cyrene
      BOT_TOKEN: ${DISCORD_CYRENE_BOT_TOKEN:-${DISCORD_AI_BOT_TOKEN:-}}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
      AI_PROVIDER_PRIMARY: ${AI_PROVIDER_PRIMARY:-}
      AI_PROVIDER_PRIMARY_MODEL: ${AI_PROVIDER_PRIMARY_MODEL:-}
      AI_PROVIDER_FALLBACK_MODEL: ${AI_PROVIDER_FALLBACK_MODEL:-}
      AI_PROVIDER_PRIMARY_KEY: ${AI_PROVIDER_PRIMARY_KEY:-}
      AI_PROVIDER_FALLBACK: ${AI_PROVIDER_FALLBACK:-}
      AI_PROVIDER_FALLBACK_KEY: ${AI_PROVIDER_FALLBACK_KEY:-}
      AI_CONCURRENT: ${AI_CONCURRENT:-2}
      AI_QUEUE_MAX: ${AI_QUEUE_MAX:-20}
      AI_DEADLINE_MS: ${AI_DEADLINE_MS:-60000}
      QWEN_TTS_URL: http://tts-qwen:3120/v1/audio/speech
      HY_MT2_URL: http://hy-mt2:3121/v1/chat/completions
      CYRENE_PERSONA_MEMORY_PATH: /persona/Cyrene_Chat_Roleplay_Memory.md
      # Release manifests add the local URL only when tts-qwen is part of that release.
      TTS_PROVIDER_URL: ${TTS_PROVIDER_URL:-}
      TTS_PROVIDER_KEY: ${TTS_PROVIDER_KEY:-}
      TTS_PROVIDER_NAME: ${TTS_PROVIDER_NAME:-default}
    volumes:
      - type: bind
        source: ${CYRENE_PERSONA_MEMORY_FILE:-../../.models/Cyrene_Chat_Roleplay_Memory.md}
        target: /persona/Cyrene_Chat_Roleplay_Memory.md
        read_only: true
    networks: [app, data, tts, translation]
    ports: ["127.0.0.1:3104:3104"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 2G } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3104/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      tts-qwen: { condition: service_started }
      hy-mt2: { condition: service_started }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  hy-mt2:
    image: "ei-point/hy-mt2:local"
    build: { context: ../.., dockerfile: apps/services/hy-mt2/Dockerfile }
    restart: unless-stopped
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    command: ["--model", "/models/Hy-MT2-1.8B-Q4_K_M.gguf", "--ctx-size", "2048", "--parallel", "1", "--threads", "${HY_MT2_THREADS:-2}", "--threads-batch", "${HY_MT2_THREADS:-2}", "--n-predict", "700", "--metrics", "--no-webui", "--host", "0.0.0.0", "--port", "3121"]
    networks: [translation]
    ports: ["127.0.0.1:3121:3121"]
    volumes:
      - type: bind
        source: ${HY_MT2_MODEL_PATH:-../../.models/hy-mt2-1.8b}
        target: /models
        read_only: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,uid=10001,gid=10001
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 2048
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 4G } } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3121/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  tts-qwen:
    image: "ei-point/tts-qwen:local"
    build: { context: ../.., dockerfile: apps/services/qwen-tts/Dockerfile }
    restart: unless-stopped
    environment:
      QWEN_TTS_MODEL_DIR: /models/qwen3-tts-12hz-0.6b-base
      QWEN_TTS_MODEL_REVISION: ${QWEN_TTS_MODEL_REVISION:-}
      QWEN_TTS_REFERENCE_AUDIO: /reference/cyrene-reference.mp3
      QWEN_TTS_REFERENCE_TEXT: "${QWEN_TTS_REFERENCE_TEXT:-Ah, there you are! Hehe, were you looking for me? Oh, don't look so surprised. I'm simply happy you're here. You know, even the smallest moments can become precious memories. So, shall we make another one together?}"
      QWEN_TTS_TORCH_THREADS: ${QWEN_TTS_TORCH_THREADS:-8}
      QWEN_TTS_QUEUE_MAX: ${QWEN_TTS_QUEUE_MAX:-2}
      QWEN_TTS_REQUEST_TIMEOUT_SECONDS: ${QWEN_TTS_REQUEST_TIMEOUT_SECONDS:-75}
      QWEN_TTS_PORT: 3120
      QWEN_TTS_STUCK_EXIT_SECONDS: ${QWEN_TTS_STUCK_EXIT_SECONDS:-60}
      QWEN_TTS_MKLDNN: ${QWEN_TTS_MKLDNN:-auto}
      # The rootfs is read-only, so numba (via librosa) needs a writable JIT cache.
      NUMBA_CACHE_DIR: /tmp
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: ${QWEN_TTS_TORCH_THREADS:-8}
      MKL_NUM_THREADS: ${QWEN_TTS_TORCH_THREADS:-8}
    volumes:
      - type: bind
        source: ${QWEN_TTS_MODEL_PATH:-../../.models/qwen3-tts-12hz-0.6b-base}
        target: /models/qwen3-tts-12hz-0.6b-base
        read_only: true
      - type: bind
        source: ${CYRENE_REFERENCE_AUDIO_PATH:-../../.models/cyrene-reference.mp3}
        target: /reference/cyrene-reference.mp3
        read_only: true
    networks: [tts]
    ports: ["127.0.0.1:3120:3120"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,uid=10001,gid=10001
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 8192
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 8G } } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3120/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  bot-music:
    build: { context: ../.., dockerfile: apps/bots/music-py/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EI_POINT_OWNER_ID: ${EI_POINT_OWNER_ID:-}
      EI_POINT_EMBED_IMAGE_URL: ${EI_POINT_EMBED_IMAGE_URL:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/docs/assets/ei-point-pulse.gif}
      EI_POINT_EMBED_IMAGE_ROBIN: ${EI_POINT_EMBED_IMAGE_ROBIN:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/project%20assets/bots/Robin/embed.png}
      BOT_KEY: robin
      BOT_TOKEN: ${DISCORD_ROBIN_BOT_TOKEN:-${DISCORD_MUSIC_BOT_TOKEN:-}}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
      MUSIC_HEALTH_PORT: 3105
      CACHE_DIR: /srv/music-cache
    networks: [app, data]
    ports: ["127.0.0.1:3105:3105"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    volumes: ["music-cache:/srv/music-cache"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 2G } } }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3105/health/ready')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  bot-commerce:
    build: { context: ../.., dockerfile: apps/bots/commerce/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EI_POINT_OWNER_ID: ${EI_POINT_OWNER_ID:-}
      EI_POINT_EMBED_IMAGE_URL: ${EI_POINT_EMBED_IMAGE_URL:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/docs/assets/ei-point-pulse.gif}
      EI_POINT_EMBED_IMAGE_CIPHER: ${EI_POINT_EMBED_IMAGE_CIPHER:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/project%20assets/bots/Cipher/embed.png}
      BOT_KEY: cipher
      PAYMENT_ORIGIN: ${PAYMENT_ORIGIN}
      UPI_PAYEE_VPA: ${UPI_PAYEE_VPA:-}
      UPI_PAYEE_NAME: ${UPI_PAYEE_NAME:-Ei point}
      USDT_TRC20_ADDRESS: ${USDT_TRC20_ADDRESS:-}
      INR_PER_USDT: ${INR_PER_USDT:-}
      RAZORPAY_PAYMENT_PAGE: ${RAZORPAY_PAYMENT_PAGE:-}
      COMMERCE_REFERRAL_REWARD_MINOR: ${COMMERCE_REFERRAL_REWARD_MINOR:-0}
      COMMERCE_STAFF_CHANNEL_ID: ${COMMERCE_STAFF_CHANNEL_ID:-}
      BOT_TOKEN: ${DISCORD_CIPHER_BOT_TOKEN:-${DISCORD_COMMERCE_BOT_TOKEN:-}}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
    networks: [app, data]
    ports: ["127.0.0.1:3106:3106"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 1536M } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3106/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  # Canonical fleet. Legacy services are isolated behind legacy-disabled; never run both.
  bot-kafka:
    build: { context: ../.., dockerfile: apps/bots/kafka/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EI_POINT_OWNER_ID: ${EI_POINT_OWNER_ID:-}
      EI_POINT_EMBED_IMAGE_URL: ${EI_POINT_EMBED_IMAGE_URL:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/docs/assets/ei-point-pulse.gif}
      EI_POINT_EMBED_IMAGE_KAFKA: ${EI_POINT_EMBED_IMAGE_KAFKA:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/project%20assets/bots/Kafka/embed.png}
      BOT_KEY: kafka
      BOT_TOKEN: ${DISCORD_KAFKA_BOT_TOKEN:-}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
      KAFKA_HEALTH_PORT: 3108
    networks: [app, data]
    ports: ["127.0.0.1:3108:3108"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 1536M } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3108/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  bot-himiko:
    build: { context: ../.., dockerfile: apps/bots/himiko/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EI_POINT_OWNER_ID: ${EI_POINT_OWNER_ID:-}
      EI_POINT_EMBED_IMAGE_URL: ${EI_POINT_EMBED_IMAGE_URL:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/docs/assets/ei-point-pulse.gif}
      EI_POINT_EMBED_IMAGE_HIMIKO: ${EI_POINT_EMBED_IMAGE_HIMIKO:-https://raw.githubusercontent.com/xyanncat/Ei-point/main/project%20assets/bots/Himiko/embed.png}
      BOT_KEY: himiko
      BOT_TOKEN: ${DISCORD_HIMIKO_BOT_TOKEN:-}
      GUILD_ALLOWLIST: ${DISCORD_TEST_GUILD_ID},${DISCORD_MAIN_GUILD_ID}
      HIMIKO_HEALTH_PORT: 3107
    networks: [app, data]
    ports: ["127.0.0.1:3107:3107"]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 512
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 1536M } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3107/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  workers:
    build: { context: ../.., dockerfile: apps/workers/Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "import pg from 'pg';const c=new pg.Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:3000});try{await c.connect();const r=await c.query(\"SELECT 1 FROM ops.service_status WHERE service='workers' AND liveness='ok' AND db_ready AND updated_at>now()-interval '90 seconds'\");process.exitCode=r.rowCount===1?0:1;}catch{process.exitCode=1;}finally{await c.end();}"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DISCORD_SECURITY_BOT_TOKEN: ${DISCORD_SECURITY_BOT_TOKEN:-}
      DISCORD_MODERATION_BOT_TOKEN: ${DISCORD_MODERATION_BOT_TOKEN:-}
      DISCORD_COMMUNITY_BOT_TOKEN: ${DISCORD_COMMUNITY_BOT_TOKEN:-}
      DISCORD_AI_BOT_TOKEN: ${DISCORD_AI_BOT_TOKEN:-}
      DISCORD_MUSIC_BOT_TOKEN: ${DISCORD_MUSIC_BOT_TOKEN:-}
      DISCORD_COMMERCE_BOT_TOKEN: ${DISCORD_COMMERCE_BOT_TOKEN:-}
      DISCORD_KAFKA_BOT_TOKEN: ${DISCORD_KAFKA_BOT_TOKEN:-}
      DISCORD_CYRENE_BOT_TOKEN: ${DISCORD_CYRENE_BOT_TOKEN:-}
      DISCORD_ROBIN_BOT_TOKEN: ${DISCORD_ROBIN_BOT_TOKEN:-}
      DISCORD_CIPHER_BOT_TOKEN: ${DISCORD_CIPHER_BOT_TOKEN:-}
      DISCORD_SILVERWOLF_BOT_TOKEN: ${DISCORD_SILVERWOLF_BOT_TOKEN:-}
      DISCORD_HIMIKO_BOT_TOKEN: ${DISCORD_HIMIKO_BOT_TOKEN:-}
      BOT_KEY: ${EMBED_WORKER_BOT_KEY:-}
      BOT_TOKEN: ${EMBED_WORKER_BOT_TOKEN:-}
    networks: [app, data]
    dns: ["10.0.0.1", "8.8.8.8", "9.9.9.9"]
    # ponytail: no hard CPU cap; weighted shares only arbitrate under contention
    cpu_shares: 1024
    cgroup_parent: ei-point.slice
    deploy: { resources: { limits: { memory: 1536M } } }
    depends_on: { postgres: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

networks:
  edge: { name: ei-point_edge }
  app:
    name: ei-point_app
    ipam:
      config: [{subnet: "${APP_SUBNET:-172.29.10.0/24}"}]
  data: { name: ei-point_data, internal: true }
  tts: { name: ei-point_tts, internal: true }
  translation: { name: ei-point_translation, internal: true }

volumes:
  pgdata: { name: ei-point_pgdata }
  pgbackrest: { name: ei-point_pgbackrest }
  artwork: { name: ei-point_artwork }
  music-cache: { name: ei-point_music-cache }
  logs: { name: ei-point_logs }
  backup-staging: { name: ei-point_backup-staging }
  tmp: { name: ei-point_tmp }
