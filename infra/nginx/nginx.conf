# Same-origin routing + local asset delivery (§3, §6, §8). Behind funnel/tunnel — no direct DB ports.
upstream api { server api:3001; }
upstream web { server web:3000; }

server {
  listen 8080;
  server_name _;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  # Local artwork/uploads: bounded, checksummed refs from DB (§4)
  location /assets/ {
    alias /srv/artwork/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /api/ { proxy_pass http://api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 65s; }
  location / { proxy_pass http://web/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 65s; }

  client_max_body_size 25m; # bound uploads per §1 WAN constraint
}
